[package]
name = "fs-automation"
description = "Aegisub Automation 4 compatible Lua host (LuaJIT via mlua)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fs-core = { version = "0.1.0", path = "../fs-core" }
icu_casemap = "2.3.0"
libc = "0.2.190"
mlua = { version = "0.12.2", features = ["luajit52", "vendored", "send"] }
pcre2-sys = "0.2.10"
thiserror = "2.0.21"

[build-dependencies]
cc = "1.8.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[target."cfg(not(windows))".dependencies]
fontdb = "0.24.0"
ttf-parser = "0.25.1"

[dev-dependencies]
tempfile = "3.27.0"
