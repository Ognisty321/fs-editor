name: CI

on:
  push:
    branches: [main]
    # a version tag builds and smoke-tests the packages as usual, then drafts its release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# read-only token everywhere; only the release job may write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Core, formats, audio, automation and the CLI: no native media stack needed.
  core:
    strategy:
      fail-fast: false
      matrix:
        # shortcut: macOS dropped from CI for now, re-add macos-latest when a Mac build is wanted.
        # Ubuntu pinned: ubuntu-latest moves to 26 on its own (2026-10-19), a move made here on purpose
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # rust-toolchain.toml's toolchain; a runner with a component's files but not its record
      # fails to add it ("detected conflict: 'bin/cargo-clippy'"), so it is installed afresh
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install || {
            rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
            rustup toolchain install
          }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  # Full GUI build: vcpkg media deps + Qt + Rust via Corrosion, packaged with CPack.
  gui:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
            triplet: x64-windows
          - os: ubuntu-24.04
            preset: unix
            triplet: x64-linux-dynamic
    runs-on: ${{ matrix.os }}
    env:
      FS_DEPS_ROOT: ${{ github.workspace }}/../deps
    steps:
      - uses: actions/checkout@v7
      # The runner image is in the key: a new image can bring a new compiler, which changes every
      # package's ABI, and an exact key hit would never save the rebuilt packages.
      - name: Runner image
        id: image
        shell: bash
        run: echo "version=${ImageOS:-local}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
      # vcpkg binary packages, so FFmpeg is only compiled when vcpkg.json, the overlay ports or the
      # compiler change
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          # actions/cache rejects paths with '..', so the binary cache lives in runner.temp
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-${{ matrix.triplet }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-
      - name: Binary cache dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-bin"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bin" >> "$GITHUB_ENV"
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build nasm libgl1-mesa-dev libxkbcommon-dev autoconf-archive bison flex gperf zip
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          modules: qtshadertools
          cache: true
          # shortcut: aqtinstall 3.3.0 (latest release) cannot read the per-compiler Windows repos of Qt >= 6.10; drop when a release can.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      # rust-toolchain.toml's toolchain; a runner with a component's files but not its record
      # fails to add it ("detected conflict: 'bin/cargo-clippy'"), so it is installed afresh
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install || {
            rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
            rustup toolchain install
          }
      - uses: Swatinem/rust-cache@v2
      - name: vcpkg
        shell: bash
        run: |
          # pinned to the baseline: the scripts of a newer checkout change every package ABI hash, missing the cache
          baseline=$(sed -n 's/.*"baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg-configuration.json)
          git init -q "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Media dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/deps.ps1 -Root "$env:FS_DEPS_ROOT"
      - name: Media dependencies (Unix)
        if: runner.os != 'Windows'
        run: TRIPLET=${{ matrix.triplet }} tools/deps.sh
      # Keep only the packages this build installed (an archive is named by the SHA-256 of the
      # package's vcpkg_abi_info.txt), so stale ones from an older restore are not saved again.
      # Nothing is deleted unless at least one archive matches.
      - name: Prune binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          keep=$(for f in "$FS_DEPS_ROOT"/installed/*/share/*/vcpkg_abi_info.txt; do sha256sum "$f" | cut -c1-64; done)
          all=$(find "$RUNNER_TEMP/vcpkg-bin" -name '*.zip')
          if grep -qFf <(sed 's/$/.zip/' <<<"$keep") <<<"$all"; then
            while read -r z; do
              grep -qxF "$(basename "$z" .zip)" <<<"$keep" || rm -f "$z"
            done <<<"$all"
          fi
          echo "kept $(find "$RUNNER_TEMP/vcpkg-bin" -name '*.zip' | wc -l) of $(wc -l <<<"$all") archives"
      # saved right after the deps build, so a later failing step does not throw it away
      - uses: actions/cache/save@v6
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-${{ matrix.triplet }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg-ports/**') }}
      - name: Media tests
        shell: bash
        run: cargo test --locked -p fs-media -p fs-bridge
      # Polish and English spell checking and thesauri, so a package works with no setup
      - name: Dictionaries
        shell: bash
        run: python -I tools/dictionaries.py "$RUNNER_TEMP/dictionaries"
      - name: Configure
        shell: bash
        run: cd app && cmake --preset ${{ matrix.preset }} -DFS_DEPS_DIR="$FS_DEPS_ROOT/installed/${{ matrix.triplet }}" -DFS_DICTIONARIES_DIR="$RUNNER_TEMP/dictionaries"
      - name: Build
        shell: bash
        run: cmake --build app/build-${{ matrix.preset }} --config Release
      - name: Package
        shell: bash
        run: cd app/build-${{ matrix.preset }} && cpack -C Release
      # unpacked by a tool that skips zip symlinks (Python's zipfile), as a user's might, every library still loads
      - name: Check package (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' app/build-unix/*.zip "$RUNNER_TEMP/pkg"
          ldd_out=$(env -u LD_LIBRARY_PATH ldd "$RUNNER_TEMP"/pkg/*/bin/fsed)
          echo "$ldd_out"
          if grep 'not found' <<<"$ldd_out"; then exit 1; fi
      - name: Check package dictionaries
        shell: bash
        run: |
          python -I -c '
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          need = ["pl_PL.aff", "pl_PL.dic", "en_US.aff", "en_US.dic", "th_pl_PL_v2.idx", "th_pl_PL_v2.dat", "th_en_US_v2.idx", "th_en_US_v2.dat"]
          missing = [f for f in need if not any(n.endswith("/bin/dictionaries/" + f) for n in names)]
          print("missing:", missing or "none")
          sys.exit(bool(missing))
          ' app/build-${{ matrix.preset }}/*.zip
      # The packaged program started through its smoke hooks (tools/smoke.sh): the window with a
      # file, a dummy video with audio, every dialog a menu command opens, the update offer.
      - name: Unpack package
        shell: bash
        run: |
          python -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' app/build-${{ matrix.preset }}/*.zip "$RUNNER_TEMP/smoke-pkg"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          tools/smoke.sh "$(ls "$tmp"/smoke-pkg/*/bin/fsed.exe)" "$tmp/smoke"
      # shortcut: not yet seen on a runner (Xvfb with Mesa's software OpenGL), so a failure is
      # reported without failing the job; drop continue-on-error once it has run green.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
          chmod +x "$RUNNER_TEMP"/smoke-pkg/*/bin/fsed
          xvfb-run -a tools/smoke.sh "$(ls "$RUNNER_TEMP"/smoke-pkg/*/bin/fsed)" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: fs-editor-${{ matrix.os }}
          path: app/build-${{ matrix.preset }}/*.zip

  # A version tag's checks, run beside the build so a missing notes file or a version mismatch shows
  # up in minutes, not after the GUI build.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/release-check.sh "$GITHUB_REF_NAME"

  # Drafts the GitHub release of a version tag from the smoke-tested packages: FS Editor <version>,
  # both ZIPs and SHA256SUMS.txt, notes from docs/releases/v<version>.md. Publishing stays manual.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gui, release-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: fs-editor-*
          path: dist
          merge-multiple: true
      - name: Packages and checksums
        working-directory: dist
        run: |
          v=${GITHUB_REF_NAME#v}
          expected="FS-Editor-$v-linux-x64.zip FS-Editor-$v-windows-x64.zip"
          actual=$(ls | sort | xargs)
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected packages '$expected', the build gave '$actual'"
            exit 1
          fi
          sha256sum --binary FS-Editor-$v-windows-x64.zip FS-Editor-$v-linux-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # a re-run refreshes its own draft; a published release is never touched
      - name: Draft release
        run: |
          v=${GITHUB_REF_NAME#v}
          notes="docs/releases/$GITHUB_REF_NAME.md"
          files=(dist/FS-Editor-$v-windows-x64.zip dist/FS-Editor-$v-linux-x64.zip dist/SHA256SUMS.txt)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; not changing it"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "FS Editor $v" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag --title "FS Editor $v" --notes-file "$notes"
          fi
          echo "draft: $(gh release view "$GITHUB_REF_NAME" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
